train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/libero_mujoco3.3.2/libero_spatial_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_object_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
    - ./data/libero_mujoco3.3.2/libero_10_no_noops_lerobot
  shape_meta:
    images:
      - key: image
        raw_shape: [3, 512, 512]
        shape: [3, 224, 224]
      - key: wrist_image
        raw_shape: [3, 512, 512]
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 7
        shape: 7
    state:
      - key: default
        raw_shape: 8
        shape: 8
  raw_action_meta:
    - key: default
      raw_shape: 7
    - key: osc_target_pose_wxyz
      raw_shape: 7
  raw_state_meta:
    - key: ee_pose_wxyz
      raw_shape: 7
    - key: gripper_open
      raw_shape: 1
  num_frames: 17
  global_sample_stride: 1
  action_video_freq_ratio: 1
  video_size: [224, 448]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  pretrained_norm_stats: ./data/libero_mujoco3.3.2/dataset_stats.json
  skip_padding_as_possible: false
  # Fail visibly on corrupt/missing LIBERO samples instead of silently
  # substituting a random training sample.
  sample_error_mode: raise
  concat_multi_camera: horizontal
  raymap_representation: libero_rothko
  rothko_norm_stats: ./data/libero_mujoco3.3.2/libero_rothko_region_symmetric_q99p95_h16_224x448.pt
  # Canonical Rothko geometry.  The model consumes this exact object through
  # interpolation, so dataset encoding and model decoding cannot drift.
  rothko_config:
    image_height: 224
    image_width: 448
    tile_height: 224
    tile_width: 224
    focal: 0.2
    center_scale: 1.0
    dir_scale: 1.0
    center_frac: 0.5
    boundary_margin: 8
    outer_margin: 8
    duplicate_horizontal: true
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 7
    proprio_output_dim: 8
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false]
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
        antialias: true
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
        antialias: true
  text_embedding_cache_dir: ./data/text_embeds_cache/libero
  context_len: 128
