# @package _global_
defaults:
  - sim_libero
  - override /task: libero_goal_axis_angle_constant_wan21
  - _self_
model:
  load_text_encoder: true
EVALUATION:
  task_suite_name: libero_goal
  num_trials: 50
  replan_steps: 8
  action_horizon: 16
  num_inference_steps: 20
  dataset_stats_path: ./data/libero_mujoco3.3.2/dataset_stats.json
