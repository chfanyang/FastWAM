# @package _global_

defaults:
  - override /data: libero_rothko_2cam224
  - override /model: fastwam_video_only_libero_rothko
  - _self_

# The selected data config jointly trains on LIBERO-Spatial, LIBERO-Object,
# LIBERO-Goal, and LIBERO-10.
output_dir: ./runs/libero_all4_rothko_2cam224_full_1e-4/${now:%Y-%m-%d}_${now:%H-%M-%S}

# Four-GPU effective global batch:
#   8 samples/GPU x 4 GPUs x 4 accumulation steps = 128 samples/update.
batch_size: 8
num_workers: 8

lr_scheduler_type: cosine
learning_rate: 1.0e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 4000
eval_every: 500
eval_num_inference_steps: 20
eval_sample_index: 0
eval_num_samples: 4
eval_random_seed: 42

gradient_accumulation_steps: 4
weight_decay: 1.0e-2
resume: null

finetune:
  method: full
  train_proprio_encoder: false

wandb:
  enabled: true
  workspace: null
  project: fast-wam
  name: libero_all4_rothko_2cam224_full_1e-4
  group: libero_all4_rothko
  mode: online
