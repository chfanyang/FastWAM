# @package _global_

defaults:
  - override /data: libero_rothko_2cam224
  - override /model: fastwam_video_only_libero_rothko
  - _self_

output_dir: ./runs/libero_goal_rothko_2cam224_full_1e-4/${now:%Y-%m-%d}_${now:%H-%M-%S}

# Train only on the complete LIBERO-Goal suite.  The shared LIBERO
# normalization and Rothko geometry statistics are intentionally inherited
# from `libero_rothko_2cam224`, so training and deployment retain the same
# action representation and decoding scale as the all-suite experiments.
data:
  train:
    dataset_dirs:
      - ./data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot

# Four-GPU effective global batch:
#   4 samples/GPU x 4 GPUs x 4 accumulation steps = 64 samples/update.
batch_size: 4
num_workers: 8

lr_scheduler_type: cosine
learning_rate: 1.0e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 500
eval_num_inference_steps: 20
eval_sample_index: 0
eval_num_samples: 4
eval_random_seed: 42

gradient_accumulation_steps: 4
weight_decay: 1.0e-2
resume: null

finetune:
  method: full
  train_proprio_encoder: false

wandb:
  enabled: true
  workspace: null
  project: fast-wam
  name: libero_goal_rothko_2cam224_full_1e-4
  group: libero_goal_rothko
  mode: online
