# @package _global_

defaults:
  - override /data: libero_rothko_2cam224
  - override /model: fastwam_video_only_libero_rothko
  - _self_

output_dir: ./runs/libero_goal_rothko_centerfrac06_2cam224_full_1e-4/${now:%Y-%m-%d}_${now:%H-%M-%S}

# Train only on the complete LIBERO-Goal suite.
data:
  train:
    dataset_dirs:
      - ./data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
    rothko_norm_stats: ./data/libero_mujoco3.3.2/libero_rothko_region_symmetric_q99p95_h16_centerfrac06_224x448.pt
    rothko_config:
      center_frac: 0.6

# Match the original LIBERO-Goal full-finetuning run:
#   4 samples/GPU x 4 GPUs x 4 accumulation steps = 64 samples/update.
batch_size: 4
num_workers: 8

lr_scheduler_type: cosine
learning_rate: 1.0e-4
num_epochs: 10
max_steps: null
log_every: 10
# Disable periodic checkpoints. The trainer still saves weights and full state
# once when max_steps is reached.
save_every: 0
eval_every: 500
eval_num_inference_steps: 20
eval_sample_index: 0
eval_num_samples: 4
eval_random_seed: 42

gradient_accumulation_steps: 4
weight_decay: 1.0e-2
resume: null

finetune:
  method: full
  train_proprio_encoder: false

wandb:
  enabled: true
  workspace: null
  project: fast-wam
  name: libero_goal_rothko_centerfrac06_2cam224_full_1e-4
  group: libero_goal_rothko_centerfrac
  mode: online
