# @package _global_

defaults:
  - override /data: libero_rothko_2cam224_h32
  - override /model: fastwam_video_only_libero_rothko_h32
  - _self_

output_dir: ./runs/libero_rothko_2cam224_h32_lora_r64_attn_ffn_1e-4/${now:%Y-%m-%d}_${now:%H-%M-%S}

# Match the released FastWAM LIBERO training scale.
batch_size: 16
num_workers: 8
pin_memory: false

lr_scheduler_type: cosine
learning_rate: 1.0e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 500
eval_num_inference_steps: 20
eval_sample_index: 0
eval_num_samples: 4
eval_random_seed: 42

gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: null

finetune:
  method: lora
  train_proprio_encoder: false
  lora:
    rank: 64
    alpha: 64.0
    dropout: 0.0
    target_modules:
      - self_attn.q
      - self_attn.k
      - self_attn.v
      - self_attn.o
      - cross_attn.q
      - cross_attn.k
      - cross_attn.v
      - cross_attn.o
      - ffn.0
      - ffn.2

wandb:
  enabled: true
  workspace: null
  project: fast-wam
  name: libero_rothko_2cam224_h32_lora_r64_attn_ffn
  group: libero_rothko_h32
  mode: online
