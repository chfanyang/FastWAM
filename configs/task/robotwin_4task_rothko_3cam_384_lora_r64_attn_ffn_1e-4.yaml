# @package _global_

defaults:
  - override /data: robotwin_rothko
  - override /model: fastwam_video_only_raymap
  - _self_

output_dir: ./runs/robotwin_4task_rothko_3cam_384_lora_r64_attn_ffn_1e-4/${now:%Y-%m-%d}_${now:%H-%M-%S}

batch_size: 8
num_workers: 2

data:
  train:
    robotwin_task_names:
      - stack_bowls_three
      - place_shoe
      - click_alarmclock
      - turn_switch
  val:
    robotwin_task_names:
      - stack_bowls_three
      - place_shoe
      - click_alarmclock
      - turn_switch

model:
  proprio_dim: null

lr_scheduler_type: cosine
learning_rate: 1.0e-4
num_epochs: 5
max_steps: 10000
log_every: 10
save_every: 1000
eval_every: 500
eval_num_inference_steps: 20

gradient_accumulation_steps: 2
weight_decay: 1.0e-2
resume: null

finetune:
  method: lora
  train_proprio_encoder: false
  lora:
    rank: 64
    alpha: 64.0
    dropout: 0.0
    target_modules:
      - self_attn.q
      - self_attn.k
      - self_attn.v
      - self_attn.o
      - cross_attn.q
      - cross_attn.k
      - cross_attn.v
      - cross_attn.o
      - ffn.0
      - ffn.2

wandb:
  enabled: true
  workspace: null
  project: fast-wam
  name: robotwin_4task_rothko_lora_r64_attn_ffn
  group: robotwin_4task_lora_capacity
  mode: online
