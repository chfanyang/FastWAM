# @package _global_

defaults:
  - override /data: robotwin_rothko
  - override /model: fastwam_video_only_raymap
  - _self_

batch_size: 8
num_workers: 2

data:
  train:
    robotwin_task_names:
      - stack_bowls_three
     # - stack_blocks_three
      - place_shoe
     # - lift_pot
     # - blocks_ranking_size
      - click_alarmclock
      - blocks_ranking_rgb
     # - turn_switch
  val:
    robotwin_task_names:
      - stack_bowls_three
     # - stack_blocks_three
      - place_shoe
    #  - lift_pot
      #- blocks_ranking_size
      - click_alarmclock
      - blocks_ranking_rgb
      #- turn_switch

lr_scheduler_type: cosine
learning_rate: 1.0e-4
num_epochs: 5
max_steps: 30000
log_every: 10
save_every: 2000
eval_every: 500
eval_num_inference_steps: 20

gradient_accumulation_steps: 2
weight_decay: 1.0e-2
resume: null

finetune:
  method: lora
  train_proprio_encoder: true
  lora:
    rank: 32
    alpha: 32.0
    dropout: 0.0
    target_modules:
      - self_attn.q
      - self_attn.k
      - self_attn.v
      - self_attn.o
      - cross_attn.q
      - cross_attn.k
      - cross_attn.v
      - cross_attn.o

wandb:
  enabled: true
  workspace: null
  project: fast-wam
  name: robotwin_video_only_rothko_3cam_384_lora_1e-4
  group: robotwin_video_only_rothko_8task_lora_r32
  mode: online
