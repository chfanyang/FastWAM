# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4
pin_memory: true

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
warmup_ratio: 0.05
num_epochs: 1
max_steps: null
log_every: 10
save_every: 100
# Optional independent interval for full resumable training state. When null,
# preserve the legacy behavior and save state whenever weights are saved.
state_save_every: null
save_at_end: true
eval_every: 50
eval_at_start: false
eval_num_inference_steps: 10
eval_sample_index: 0
eval_num_samples: 4
eval_random_seed: 42

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null
# Emergency escape hatch for a manually audited mismatch.  Keep false by
# default; save/log/eval intervals do not participate in compatibility checks.
resume_allow_config_mismatch: false

# parameter-efficient fine-tuning
finetune:
  method: full # one of: [full, lora]
  train_proprio_encoder: true
  lora:
    rank: 16
    alpha: 16.0
    dropout: 0.0
    target_modules:
      - self_attn.q
      - self_attn.k
      - self_attn.v
      - self_attn.o
      - cross_attn.q
      - cross_attn.k
      - cross_attn.v
      - cross_attn.o

# wandb
wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: train
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
